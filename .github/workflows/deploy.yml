name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/tmcai
            git pull origin main
            cd server
            npm ci
            npx prisma migrate deploy
            npm run build
            cd ../client
            npm ci
            npm run build
            pm2 reload tmcai-server
