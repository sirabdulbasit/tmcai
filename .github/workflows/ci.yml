name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: TypeScript typecheck
        run: cd server && npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Run tests
        run: cd server && npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install and build server
        run: cd server && npm ci && npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and build client
        run: cd client && npm ci && npm run build

  rollback-sql-check:
    name: Verify Rollback SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify rollback SQL exists for every migration
        run: |
          missing=0
          for dir in server/prisma/migrations/*/; do
            if [ -f "$dir/migration.sql" ] && [ ! -f "$dir/rollback.sql" ]; then
              echo "MISSING rollback.sql in $dir"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All migrations have rollback.sql"
